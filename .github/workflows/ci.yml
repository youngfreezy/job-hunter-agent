name: CI

on:
  push:
    branches: [main, staging, browserbase-mode]
  pull_request:
    branches: [main, staging, browserbase-mode]

permissions:
  contents: read

jobs:
  tooling-and-marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/marketing-agent/package-lock.json
      - run: npm test
      - run: npm ci --ignore-scripts
        working-directory: packages/marketing-agent
      - run: npm test && npm run build
        working-directory: packages/marketing-agent

  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what Dockerfile.backend ships; 3.12 is the local dev venv.
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobhunter
          POSTGRES_PASSWORD: jobhunter_dev
          POSTGRES_DB: jobhunter
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobhunter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install backend dependencies
        run: |
          python -m pip install "pip==26.1.2"
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements.txt -r backend/requirements-test.txt
          python -m pip check

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://jobhunter:jobhunter_dev@localhost:5433/jobhunter
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: ci-test-secret
          BROWSER_MODE: cdp
        # Tests marked requires_postgres run against the service above;
        # Browserbase, LLM and network calls are mocked in the suite.
        run: python -m pytest backend/tests/ -x -q -p no:cacheprovider

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXTAUTH_SECRET: ci-test-secret
        run: npx next build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npx next lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json
